[project]
name = "torch-techtest"
version = "0.1.0"
description = "Torch take-home exercise — assessment agent skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "numpy<2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "openai>=2.30.0",
    "pycaret>=2.2.2",
    "onnxruntime>=1.24.4",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langchain-chroma>=1.1.0",
    "codetiming>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
