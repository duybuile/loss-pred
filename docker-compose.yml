services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loss-pred-api:latest
    container_name: loss-pred-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Historical records — read-only, bind-mounted from host
      - ./data:/app/data:ro
      # Model and pipeline artifacts — read-only, bind-mounted from host
      - ./app/artifacts:/app/app/artifacts:ro
      # ChromaDB vector store — persisted across restarts in a named volume
      - ./.chroma:/app/.chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: loss-pred-frontend:latest
    container_name: loss-pred-frontend
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      ASSESS_API_BASE_URL: "http://api:8000"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
